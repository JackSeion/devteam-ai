services:
  postgres:
    image: postgres:16
    container_name: devteam-postgres
    environment:
      POSTGRES_USER: devteam
      POSTGRES_PASSWORD: devteam
      POSTGRES_DB: devteam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: